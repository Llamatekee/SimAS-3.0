[Application]
app.classpath=$APPDIR/SimAS.jar
app.mainclass=bienvenida.Bienvenida
app.classpath=$APPDIR/itextpdf-5.5.13.3.jar
app.classpath=$APPDIR/javafx/lib/javafx-swt.jar
app.classpath=$APPDIR/javafx/lib/javafx.base.jar
app.classpath=$APPDIR/javafx/lib/javafx.controls.jar
app.classpath=$APPDIR/javafx/lib/javafx.fxml.jar
app.classpath=$APPDIR/javafx/lib/javafx.graphics.jar
app.classpath=$APPDIR/javafx/lib/javafx.media.jar
app.classpath=$APPDIR/javafx/lib/javafx.swing.jar
app.classpath=$APPDIR/javafx/lib/javafx.web.jar

[JavaOptions]
java-options=-Djpackage.app-version=1.0
java-options=--module-path
java-options=$APPDIR/javafx/lib
java-options=--add-modules=javafx.controls,javafx.fxml,javafx.graphics,javafx.media,javafx.web,javafx.swing
